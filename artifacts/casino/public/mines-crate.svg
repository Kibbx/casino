<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <defs>
    <!-- Wood gradients per plank row for natural variation -->
    <linearGradient id="plk1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5e3414"/>
      <stop offset="35%"  stop-color="#4c2a0a"/>
      <stop offset="70%"  stop-color="#5a3210"/>
      <stop offset="100%" stop-color="#3e2006"/>
    </linearGradient>
    <linearGradient id="plk2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4a2808"/>
      <stop offset="40%"  stop-color="#5c3212"/>
      <stop offset="75%"  stop-color="#442606"/>
      <stop offset="100%" stop-color="#5a3010"/>
    </linearGradient>
    <linearGradient id="plk3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#562e0e"/>
      <stop offset="30%"  stop-color="#3e2006"/>
      <stop offset="65%"  stop-color="#5a3212"/>
      <stop offset="100%" stop-color="#422208"/>
    </linearGradient>
    <!-- Metal bracket gradient -->
    <linearGradient id="met" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#e0bc50"/>
      <stop offset="40%"  stop-color="#b08830"/>
      <stop offset="100%" stop-color="#7a5418"/>
    </linearGradient>
    <!-- Nail head gradient -->
    <linearGradient id="nail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#f0cc60"/>
      <stop offset="60%"  stop-color="#a07828"/>
      <stop offset="100%" stop-color="#6a4810"/>
    </linearGradient>
    <!-- Brace wood -->
    <linearGradient id="brc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7a5018" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#c8a040" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7a5018" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Surface ambient lighting: dark at edges, slight lift in center -->
    <radialGradient id="amb" cx="50%" cy="45%" r="60%">
      <stop offset="0%"   stop-color="rgba(255,200,100,0.12)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.35)"/>
    </radialGradient>
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="rgba(0,0,0,0.7)"/>
    </filter>
  </defs>

  <!-- Outer dark border/frame -->
  <rect x="0" y="0" width="120" height="80" rx="8" fill="#140800"/>

  <!-- ── PLANK 1 (top) ────────────────────────────────── -->
  <rect x="1" y="1" width="118" height="25" rx="6" fill="url(#plk1)"/>
  <!-- Grain lines -->
  <line x1="22"  y1="1" x2="22"  y2="26" stroke="#1a0800" stroke-width="0.7" stroke-opacity="0.5"/>
  <line x1="47"  y1="1" x2="47"  y2="26" stroke="#1a0800" stroke-width="0.6" stroke-opacity="0.4"/>
  <line x1="72"  y1="1" x2="72"  y2="26" stroke="#1a0800" stroke-width="0.7" stroke-opacity="0.45"/>
  <line x1="97"  y1="1" x2="97"  y2="26" stroke="#1a0800" stroke-width="0.6" stroke-opacity="0.4"/>

  <!-- ── GROOVE 1 ──────────────────────────────────────── -->
  <rect x="1" y="26" width="118" height="2.5" fill="#0e0500"/>
  <rect x="1" y="28.5" width="118" height="1"   fill="rgba(255,180,50,0.07)"/>

  <!-- ── PLANK 2 (middle) ──────────────────────────────── -->
  <rect x="1" y="29.5" width="118" height="21" fill="url(#plk2)"/>
  <line x1="28"  y1="29.5" x2="28"  y2="50.5" stroke="#1a0800" stroke-width="0.7" stroke-opacity="0.5"/>
  <line x1="60"  y1="29.5" x2="60"  y2="50.5" stroke="#1a0800" stroke-width="0.6" stroke-opacity="0.35"/>
  <line x1="92"  y1="29.5" x2="92"  y2="50.5" stroke="#1a0800" stroke-width="0.7" stroke-opacity="0.5"/>

  <!-- ── GROOVE 2 ──────────────────────────────────────── -->
  <rect x="1" y="50.5" width="118" height="2.5" fill="#0e0500"/>
  <rect x="1" y="53"   width="118" height="1"   fill="rgba(255,180,50,0.07)"/>

  <!-- ── PLANK 3 (bottom) ──────────────────────────────── -->
  <rect x="1" y="54" width="118" height="25" rx="6" fill="url(#plk3)"/>
  <line x1="18"  y1="54" x2="18"  y2="79" stroke="#1a0800" stroke-width="0.7" stroke-opacity="0.45"/>
  <line x1="42"  y1="54" x2="42"  y2="79" stroke="#1a0800" stroke-width="0.6" stroke-opacity="0.4"/>
  <line x1="66"  y1="54" x2="66"  y2="79" stroke="#1a0800" stroke-width="0.7" stroke-opacity="0.5"/>
  <line x1="90"  y1="54" x2="90"  y2="79" stroke="#1a0800" stroke-width="0.6" stroke-opacity="0.4"/>
  <line x1="108" y1="54" x2="108" y2="79" stroke="#1a0800" stroke-width="0.7" stroke-opacity="0.4"/>

  <!-- ── X CROSS-BRACE ──────────────────────────────────── -->
  <!-- Shadow stroke below brace for depth -->
  <line x1="5"  y1="5"  x2="115" y2="75" stroke="#0a0400" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="115" y1="5" x2="5"  y2="75" stroke="#0a0400" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6"/>
  <!-- Main brace bars -->
  <line x1="5"  y1="5"  x2="115" y2="75" stroke="url(#brc)" stroke-width="3" stroke-linecap="round"/>
  <line x1="115" y1="5" x2="5"  y2="75" stroke="url(#brc)" stroke-width="3" stroke-linecap="round"/>
  <!-- Highlight line on brace top edge -->
  <line x1="5"  y1="4"  x2="115" y2="74" stroke="rgba(220,170,50,0.25)" stroke-width="1" stroke-linecap="round"/>
  <line x1="115" y1="4" x2="5"  y2="74" stroke="rgba(220,170,50,0.25)" stroke-width="1" stroke-linecap="round"/>

  <!-- ── CORNER BRACKETS ─────────────────────────────────── -->
  <!-- Top-left -->
  <rect x="3"  y="3"  width="18" height="3.5" rx="1.5" fill="url(#met)" filter="url(#shadow)"/>
  <rect x="3"  y="3"  width="3.5" height="18" rx="1.5" fill="url(#met)" filter="url(#shadow)"/>
  <!-- Top-right -->
  <rect x="99" y="3"  width="18" height="3.5" rx="1.5" fill="url(#met)" filter="url(#shadow)"/>
  <rect x="113.5" y="3"  width="3.5" height="18" rx="1.5" fill="url(#met)" filter="url(#shadow)"/>
  <!-- Bottom-left -->
  <rect x="3"  y="73.5" width="18" height="3.5" rx="1.5" fill="url(#met)" filter="url(#shadow)"/>
  <rect x="3"  y="59"  width="3.5" height="18" rx="1.5" fill="url(#met)" filter="url(#shadow)"/>
  <!-- Bottom-right -->
  <rect x="99" y="73.5" width="18" height="3.5" rx="1.5" fill="url(#met)" filter="url(#shadow)"/>
  <rect x="113.5" y="59"  width="3.5" height="18" rx="1.5" fill="url(#met)" filter="url(#shadow)"/>

  <!-- ── NAIL HEADS ──────────────────────────────────────── -->
  <!-- Brace corner nails -->
  <circle cx="9"   cy="9"   r="3.5" fill="url(#nail)"/>
  <circle cx="7.5" cy="7.5" r="1.2" fill="rgba(255,255,255,0.45)"/>

  <circle cx="111" cy="9"   r="3.5" fill="url(#nail)"/>
  <circle cx="109.5" cy="7.5" r="1.2" fill="rgba(255,255,255,0.45)"/>

  <circle cx="9"   cy="71"  r="3.5" fill="url(#nail)"/>
  <circle cx="7.5" cy="69.5" r="1.2" fill="rgba(255,255,255,0.45)"/>

  <circle cx="111" cy="71"  r="3.5" fill="url(#nail)"/>
  <circle cx="109.5" cy="69.5" r="1.2" fill="rgba(255,255,255,0.45)"/>

  <!-- Center nail at X intersection -->
  <circle cx="60"  cy="40"  r="5"   fill="url(#nail)" filter="url(#shadow)"/>
  <circle cx="58"  cy="38"  r="2"   fill="rgba(255,255,255,0.5)"/>

  <!-- Plank groove nails (small, evenly spaced) -->
  <circle cx="30" cy="28" r="2" fill="url(#nail)" opacity="0.8"/>
  <circle cx="90" cy="28" r="2" fill="url(#nail)" opacity="0.8"/>
  <circle cx="30" cy="52" r="2" fill="url(#nail)" opacity="0.8"/>
  <circle cx="90" cy="52" r="2" fill="url(#nail)" opacity="0.8"/>

  <!-- ── AMBIENT LIGHT / VIGNETTE overlay ───────────────── -->
  <rect x="1" y="1" width="118" height="78" rx="6" fill="url(#amb)"/>

  <!-- Top-left highlight edge -->
  <rect x="1" y="1" width="118" height="2" rx="6" fill="rgba(255,200,80,0.1)"/>
  <rect x="1" y="1" width="2" height="78" rx="6" fill="rgba(255,200,80,0.07)"/>

  <!-- ── INNER FRAME OUTLINE ─────────────────────────────── -->
  <rect x="5" y="5" width="110" height="70" rx="4" fill="none"
        stroke="rgba(200,145,30,0.22)" stroke-width="1"/>
</svg>
