<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <defs>
    <!-- Bill gradients -->
    <linearGradient id="bl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#28b848"/>
      <stop offset="100%" stop-color="#147228"/>
    </linearGradient>
    <linearGradient id="blm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#32cc55"/>
      <stop offset="100%" stop-color="#1a8a35"/>
    </linearGradient>
    <!-- Bag body -->
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#22253a"/>
      <stop offset="55%"  stop-color="#181b28"/>
      <stop offset="100%" stop-color="#0c0e18"/>
    </linearGradient>
    <!-- Bag sides (darker) -->
    <linearGradient id="bside" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="rgba(0,0,0,0.45)"/>
      <stop offset="18%"  stop-color="rgba(0,0,0,0)"/>
      <stop offset="82%"  stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.45)"/>
    </linearGradient>
    <!-- Pocket -->
    <linearGradient id="pkt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#14172a"/>
      <stop offset="100%" stop-color="#0a0c16"/>
    </linearGradient>
    <!-- Gold -->
    <linearGradient id="gld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f0d060"/>
      <stop offset="50%"  stop-color="#c8a030"/>
      <stop offset="100%" stop-color="#845c10"/>
    </linearGradient>
    <!-- Handle strap -->
    <linearGradient id="hndl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2c3050"/>
      <stop offset="100%" stop-color="#141628"/>
    </linearGradient>
    <!-- Shadows -->
    <filter id="ds" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="rgba(0,0,0,0.75)"/>
    </filter>
    <filter id="bsf" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.85)"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ═══ CARRY HANDLE (behind bills) ═══ -->
  <path d="M 46 42 C 46 27, 74 27, 74 42"
        fill="none" stroke="url(#hndl)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 46 42 C 46 27, 74 27, 74 42"
        fill="none" stroke="#252840" stroke-width="5" stroke-linecap="round"/>
  <!-- Handle top highlight -->
  <path d="M 48 40 C 48 30, 72 30, 72 40"
        fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Handle rivet left -->
  <circle cx="46" cy="42" r="3" fill="url(#gld)"/>
  <circle cx="45" cy="41" r="1" fill="rgba(255,255,255,0.5)"/>
  <!-- Handle rivet right -->
  <circle cx="74" cy="42" r="3" fill="url(#gld)"/>
  <circle cx="73" cy="41" r="1" fill="rgba(255,255,255,0.5)"/>

  <!-- ═══ LEFT BILL (−16°) ═══ -->
  <g transform="translate(23,34) rotate(-16)">
    <rect x="-13" y="-24" width="26" height="24" rx="2" fill="url(#bl)" filter="url(#ds)" stroke="#0a3812" stroke-width="0.8"/>
    <rect x="-11" y="-22" width="22" height="20" rx="1.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.7"/>
    <!-- Portrait oval -->
    <ellipse cx="0" cy="-12" rx="5" ry="6" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.12)" stroke-width="0.6"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Georgia,serif" font-size="8" font-weight="bold" fill="rgba(255,255,255,0.7)">$</text>
    <!-- Denomination corners -->
    <text x="-10" y="-19" font-family="Arial" font-size="5" font-weight="bold" fill="rgba(255,255,255,0.5)">1</text>
    <text x="10"  y="-19" font-family="Arial" font-size="5" font-weight="bold" fill="rgba(255,255,255,0.5)" text-anchor="end">1</text>
    <!-- Serial number line -->
    <line x1="-10" y1="-2" x2="10" y2="-2" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
  </g>

  <!-- ═══ RIGHT BILL (+16°) ═══ -->
  <g transform="translate(97,34) rotate(16)">
    <rect x="-13" y="-24" width="26" height="24" rx="2" fill="url(#bl)" filter="url(#ds)" stroke="#0a3812" stroke-width="0.8"/>
    <rect x="-11" y="-22" width="22" height="20" rx="1.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.7"/>
    <ellipse cx="0" cy="-12" rx="5" ry="6" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.12)" stroke-width="0.6"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Georgia,serif" font-size="8" font-weight="bold" fill="rgba(255,255,255,0.7)">$</text>
    <text x="-10" y="-19" font-family="Arial" font-size="5" font-weight="bold" fill="rgba(255,255,255,0.5)">1</text>
    <text x="10"  y="-19" font-family="Arial" font-size="5" font-weight="bold" fill="rgba(255,255,255,0.5)" text-anchor="end">1</text>
    <line x1="-10" y1="-2" x2="10" y2="-2" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
  </g>

  <!-- ═══ CENTER BILL (straight, tallest) ═══ -->
  <g transform="translate(60,30)">
    <rect x="-16" y="-26" width="32" height="26" rx="2.5" fill="url(#blm)" filter="url(#ds)" stroke="#084010" stroke-width="1"/>
    <rect x="-13" y="-23" width="26" height="20" rx="2" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.8"/>
    <!-- Portrait oval -->
    <ellipse cx="0" cy="-13" rx="6.5" ry="7.5" fill="rgba(0,0,0,0.2)" stroke="rgba(255,255,255,0.14)" stroke-width="0.7"/>
    <text x="0" y="-11" text-anchor="middle" font-family="Georgia,serif" font-size="11" font-weight="bold" fill="rgba(255,255,255,0.85)">$</text>
    <!-- Denomination corners -->
    <text x="-12" y="-20" font-family="Arial" font-size="6" font-weight="bold" fill="rgba(255,255,255,0.6)">100</text>
    <text x="12"  y="-20" font-family="Arial" font-size="6" font-weight="bold" fill="rgba(255,255,255,0.6)" text-anchor="end">100</text>
    <!-- Bottom lines -->
    <line x1="-11" y1="-2" x2="11" y2="-2" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
    <line x1="-11" y1="-5" x2="11" y2="-5" stroke="rgba(255,255,255,0.08)" stroke-width="0.6"/>
  </g>

  <!-- ═══ BAG BODY ═══ -->
  <rect x="5" y="37" width="110" height="40" rx="13" fill="url(#bag)" filter="url(#bsf)"/>
  <!-- Bag side vignette -->
  <rect x="5" y="37" width="110" height="40" rx="13" fill="url(#bside)"/>
  <!-- Subtle top surface highlight -->
  <rect x="5" y="37" width="110" height="6" rx="13" fill="rgba(255,255,255,0.04)"/>
  <!-- Bottom edge shadow -->
  <rect x="9"  y="74" width="102" height="2" rx="1" fill="rgba(0,0,0,0.35)"/>

  <!-- ═══ BAG OPENING / ZIPPER ═══ -->
  <!-- Dark mouth of bag -->
  <ellipse cx="60" cy="39" rx="44" ry="4" fill="#0c0e1a"/>
  <!-- Cash green ambient spilling up -->
  <ellipse cx="60" cy="38" rx="36" ry="2.5" fill="rgba(28,160,60,0.18)" filter="url(#glow)"/>
  <!-- Zipper track -->
  <rect x="18" y="37.5" width="84" height="3" rx="1.5" fill="#191c2e" stroke="rgba(212,168,32,0.35)" stroke-width="0.5"/>
  <!-- Zipper teeth -->
  <line x1="22" y1="39" x2="98" y2="39" stroke="rgba(212,168,32,0.55)" stroke-width="1.8" stroke-dasharray="3.5,3" stroke-linecap="round"/>
  <!-- Zipper pull tab -->
  <rect x="56.5" y="36.5" width="7" height="4.5" rx="2" fill="url(#gld)"/>
  <circle cx="60" cy="38.5" r="1.5" fill="rgba(255,255,255,0.45)"/>

  <!-- ═══ FRONT POCKET ═══ -->
  <rect x="30" y="51" width="60" height="20" rx="7" fill="url(#pkt)" stroke="rgba(255,255,255,0.07)" stroke-width="0.8"/>
  <!-- Pocket stitch line -->
  <rect x="33" y="54" width="54" height="14" rx="5" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.8" stroke-dasharray="3,3"/>
  <!-- Pocket zipper -->
  <line x1="36" y1="53.5" x2="84" y2="53.5" stroke="rgba(212,168,32,0.4)" stroke-width="1.2" stroke-dasharray="2.5,2.5" stroke-linecap="round"/>
  <!-- Pocket zip pull -->
  <rect x="57" y="52.2" width="6" height="3" rx="1.5" fill="url(#gld)"/>

  <!-- ═══ SIDE D-RINGS ═══ -->
  <!-- Left D-ring -->
  <rect x="8"  y="49" width="8" height="12" rx="3.5" fill="none" stroke="url(#gld)" stroke-width="2" filter="url(#ds)"/>
  <rect x="8"  y="49" width="8" height="4"  rx="2"   fill="url(#gld)"/>
  <!-- Right D-ring -->
  <rect x="104" y="49" width="8" height="12" rx="3.5" fill="none" stroke="url(#gld)" stroke-width="2" filter="url(#ds)"/>
  <rect x="104" y="49" width="8" height="4"  rx="2"   fill="url(#gld)"/>

  <!-- ═══ BRAND STAMP on pocket ═══ -->
  <text x="60" y="64" text-anchor="middle" font-family="'Arial Black',Arial" font-size="6.5"
        font-weight="900" letter-spacing="1" fill="rgba(255,255,255,0.12)">BAB</text>
</svg>
