          enum: [active, player_bust, player_blackjack, dealer_bust, player_win, dealer_win, push, abandoned]
        playerCards:
          type: array
          items:
            $ref: "#/components/schemas/BlackjackCard"
        dealerCards:
          type: array
          items:
            $ref: "#/components/schemas/BlackjackCard"
        bet:
          type: integer
        payout:
          type: integer
          nullable: true
        playerValue:
          type: integer
        dealerValue:
          type: integer
        createdAt:
